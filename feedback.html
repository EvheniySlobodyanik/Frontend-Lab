<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Зворотній зв’язок — MedConsult Online</title>
  </head>
  <body>
    <header>
      <img
        src="https://images.unsplash.com/photo-1505751172876-fa1923c5c528?w=70&h=70&fit=crop"
        alt="Логотип MedConsult Online"
        width="70"
        height="70"
      />
      <h1>MedConsult Online</h1>
      <p>Служба зв’язку з клієнтами та технічної підтримки</p>
      <nav>
        <a href="index.html">Головна</a> | <a href="services.html">Послуги</a> |
        <a href="feedback.html">Зворотній зв’язок</a>
      </nav>
    </header>

    <hr />

    <main>
      <h2>Форма зворотнього зв’язку</h2>

      <form action="#" method="post">
        <fieldset>
          <legend>Персональна інформація</legend>

          <p>
            <label for="userName">1. Прізвище та ім’я:</label><br />
            <input
              type="text"
              id="userName"
              name="userName"
              placeholder="Наприклад: Слободяник Євгеній"
              required
            />
          </p>

          <p>
            <label for="userEmail">2. E-mail:</label><br />
            <input
              type="email"
              id="userEmail"
              name="userEmail"
              placeholder="name@domain.com"
              required
            />
          </p>

          <p>
            <label for="userAge">3. Вік:</label><br />
            <input
              type="number"
              id="userAge"
              name="userAge"
              min="1"
              max="120"
              placeholder="20"
              required
            />
          </p>
        </fieldset>

        <br />

        <p>
          <label for="feedbackTopic">4. Мета зворотнього зв’язку:</label><br />
          <select id="feedbackTopic" name="feedbackTopic" required>
            <option value="" disabled selected>
              -- Оберіть мету звернення --
            </option>
            <option value="cooperation">співпраця</option>
            <option value="service-complaint">скарга на якість послуги</option>
            <option value="suggestion">пропозиція</option>
            <option value="site-bug">наявність помилки на сайті</option>
          </select>
        </p>

        <p>
          <label for="feedbackDetail">5. Детально:</label><br />
          <textarea
            id="feedbackDetail"
            name="feedbackDetail"
            rows="6"
            cols="55"
            maxlength="350"
            placeholder="Опишіть ваше питання або пропозицію (не більше 350 символів)..."
            required
          ></textarea>
        </p>

        <p>
          <input type="checkbox" id="userConsent" name="userConsent" required />
          <label for="userConsent"
            >Я надаю згоду на обробку персональної інформації.</label
          >
        </p>

        <p>
          <button type="submit">Надіслати звернення</button>
          <button type="reset">Скинути форму</button>
        </p>
      </form>
    </main>

    <hr />
    <footer>
      <p>&copy; 2026 MedConsult Online. Підтримка клієнтів.</p>
    </footer>
  </body>
</html>
